name: One-off conservative comparator alignment audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-tighten-comparator-alignment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten weak alignments
        run: node scripts/tmp-tighten-comparator-alignment.mjs
      - name: Validate counselor records
        run: npm run validate:counselor
      - name: Rebuild review indexes
        run: npm run build:counselor-review
      - name: Validate review indexes
        run: npm run validate:counselor-review
      - name: Run repository quality tests
        run: npm test
      - name: Commit conservative alignment audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/counselor/comparisons/cp-000001.json data/counselor/comparisons/cp-000002.json data/counselor/comparisons/cp-000003.json data/counselor/comparisons/cp-000004.json data/counselor/review-programmes.json data/counselor/review-interests.json
          git commit -m "Tighten comparator semantic alignment"
          git push
