name: Build comparator longlist

# Reproducible research build for Step 1 of the comparator-seeded portfolio experiment.
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/build_comparator_longlist.py'
      - 'research/reconcile_comparator_longlist.py'
      - '.github/workflows/build-comparator-longlist.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build external Dutch WO bachelor longlist
        run: python research/build_comparator_longlist.py

      - name: Reconcile offering and programme-provider views
        run: python research/reconcile_comparator_longlist.py

      - name: Show generated summary
        run: |
          cat research/comparator_longlist/README.md
          echo
          cat research/comparator_longlist/step1_summary.json

      - name: Commit Step 1 research outputs
        run: |
          if git diff --quiet -- research/comparator_longlist/ && [ -z "$(git status --porcelain research/comparator_longlist/)" ]; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/comparator_longlist/
          git commit -m "Save Step 1 Dutch WO bachelor longlist"
          git push
