name: Build LinkedIn PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/build-linkedin-html.mjs'
      - 'scripts/render-linkedin-pdf.mjs'
      - '.github/workflows/build-linkedin-pdf.yml'

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Build LinkedIn print page
        run: node scripts/build-linkedin-html.mjs

      - name: Generate PDF
        run: node scripts/render-linkedin-pdf.mjs

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-pdf
          path: output/ucr-program-builder-linkedin.pdf
          retention-days: 30
