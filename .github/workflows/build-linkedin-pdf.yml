name: Build PDFs

on:
  workflow_dispatch:
    inputs:
      example_id:
        description: 'Example id to build, or all'
        required: false
        default: 'all'
  push:
    branches: [main]
    paths:
      - 'data/examples/**'
      - 'data/schema/**'
      - 'assets/css/linkedin.css'
      - 'assets/css/linkedin-alignment.css'
      - 'assets/css/open-day.css'
      - 'assets/brand/**'
      - 'assets/fonts/**'
      - 'scripts/**'
      - '.github/workflows/build-linkedin-pdf.yml'

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    env:
      EXAMPLE_ID: ${{ github.event.inputs.example_id || 'all' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate example data
        run: node scripts/validate-example.mjs "$EXAMPLE_ID"

      - name: Install Playwright and Chromium
        timeout-minutes: 10
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium

      - name: Build LinkedIn print pages
        run: node scripts/build-linkedin-html.mjs "$EXAMPLE_ID"

      - name: Build Open Day print pages
        run: node scripts/build-open-day-html.mjs "$EXAMPLE_ID"

      - name: Generate LinkedIn PDFs
        run: node scripts/render-linkedin-pdf.mjs "$EXAMPLE_ID"

      - name: Generate Open Day PDFs
        run: node scripts/render-open-day-pdf.mjs "$EXAMPLE_ID"

      - name: Upload LinkedIn PDFs
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-pdfs
          path: output/linkedin/*.pdf
          retention-days: 30

      - name: Upload Open Day PDFs
        uses: actions/upload-artifact@v4
        with:
          name: open-day-pdfs
          path: output/open-day/*.pdf
          retention-days: 30
