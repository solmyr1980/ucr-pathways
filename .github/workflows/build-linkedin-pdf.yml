name: Build LinkedIn PDFs

on:
  workflow_dispatch:
    inputs:
      example_id:
        description: 'Example id to build, or all'
        required: false
        default: 'all'
  push:
    branches: [main]
    paths:
      - 'data/examples/**'
      - 'data/schema/**'
      - 'assets/css/linkedin.css'
      - 'assets/fonts/**'
      - 'scripts/**'
      - '.github/workflows/build-linkedin-pdf.yml'

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    env:
      EXAMPLE_ID: ${{ github.event.inputs.example_id || 'all' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate example data
        run: node scripts/validate-example.mjs "$EXAMPLE_ID"

      - name: Install Playwright and Chromium
        timeout-minutes: 10
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Build LinkedIn print pages
        run: node scripts/build-linkedin-html.mjs "$EXAMPLE_ID"

      - name: Generate PDFs
        run: node scripts/render-linkedin-pdf.mjs "$EXAMPLE_ID"

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-pdfs
          path: output/linkedin/*.pdf
          retention-days: 30
