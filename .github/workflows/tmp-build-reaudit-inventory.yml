name: One-off counselor reaudit inventory
on:
  push:
    paths:
      - '.github/workflows/tmp-build-reaudit-inventory.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build inventory
        run: node scripts/tmp-build-reaudit-inventory.mjs
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/counselor/tmp-reaudit-inventory.json
          git diff --cached --quiet && exit 0
          git commit -m "Build counselor reaudit inventory"
          git push origin HEAD:main
