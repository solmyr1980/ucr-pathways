name: Dispatch requested Qwen review once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/start-qwen-review-once.yml']
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[start qwen pilot]')
    runs-on: ubuntu-24.04
    steps:
      - name: Start the isolated audio review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test-curriculum-voice-qwen.yml --repo "$GITHUB_REPOSITORY" --ref main -f one_time_delivery=true
