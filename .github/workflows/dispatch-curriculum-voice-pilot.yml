name: Dispatch the initial curriculum voice test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-curriculum-voice-pilot.yml

permissions:
  actions: write

jobs:
  dispatch:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Dispatch the manual curriculum voice test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run test-curriculum-voice.yml --repo "$GITHUB_REPOSITORY" --ref main -f reference_source=pilot-transfer
