name: Render curriculum video pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pilot/curriculum-video/*.py'
      - 'pilot/curriculum-video/storyboard.json'
      - '.github/workflows/render-curriculum-video.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[render curriculum video]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PILOT_DIR: pilot/curriculum-video
      KOKORO_RELEASE: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2 fonts-liberation
          python -m pip install kokoro-onnx==0.4.9 onnxruntime==1.32.0 openpyxl==3.1.5 Pillow==13.0.0 CairoSVG==2.9.1 zxing-cpp==3.1.1 pocketsphinx==5.0.4

      - name: Download Kokoro and verify the Heart voice pack
        run: |
          out="$RUNNER_TEMP/ucr-curriculum-video"
          mkdir -p "$out"
          curl --fail --silent --show-error --location --retry 3 "$KOKORO_RELEASE/kokoro-v1.0.onnx" -o "$out/kokoro-v1.0.onnx"
          curl --fail --silent --show-error --location --retry 3 "$KOKORO_RELEASE/voices-v1.0.bin" -o "$out/voices-v1.0.bin"

          (cd "$out" && sha256sum --check <<'SUMS'
          7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  kokoro-v1.0.onnx
          bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  voices-v1.0.bin
          SUMS
          )

      - name: Synthesize narration, time English subtitles and render MP4
        run: |
          out="$RUNNER_TEMP/ucr-curriculum-video"
          python "$PILOT_DIR/narrate.py" "$out/kokoro-v1.0.onnx" "$out/voices-v1.0.bin" "$out"
          python "$PILOT_DIR/render.py" "$out"

      - name: Verify the pilot
        run: |
          out="$RUNNER_TEMP/ucr-curriculum-video"
          python "$PILOT_DIR/verify.py" "$out" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stage the approved YouTube materials
        run: |
          out="$RUNNER_TEMP/ucr-curriculum-video"
          python "$PILOT_DIR/package_youtube.py" "$out" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: UCR-curriculum-pilot
          path: |
            ${{ runner.temp }}/ucr-curriculum-video/UCR-curriculum-pilot.mp4
            ${{ runner.temp }}/ucr-curriculum-video/UCR-curriculum-pilot.en.srt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: UCR-curriculum-youtube-package
          path: ${{ runner.temp }}/ucr-curriculum-video/youtube/
          if-no-files-found: error
          retention-days: 14
