name: Render curriculum video pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pilot/curriculum-video/*.py'
      - 'pilot/curriculum-video/storyboard.json'
      - '.github/workflows/render-curriculum-video.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[render curriculum video]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PILOT_DIR: pilot/curriculum-video
      MODEL_URL: https://huggingface.co/rhasspy/piper-voices/resolve/0ca208afc2a2ee102b1e961e72e0a7e4907be3d0/en/en_GB/alba/medium/en_GB-alba-medium.onnx
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2 fonts-liberation
          python -m pip install piper-tts==1.8.0 openpyxl==3.1.5 Pillow==13.0.0 CairoSVG==2.9.1 zxing-cpp==3.1.1 pocketsphinx==5.0.4 praat-parselmouth==0.4.7

      - name: Download the Alba voice
        run: |
          out="$RUNNER_TEMP/ucr-curriculum-video"
          mkdir -p "$out"
          curl --fail --silent --show-error --location --retry 3 "$MODEL_URL" -o "$out/alba.onnx"
          curl --fail --silent --show-error --location --retry 3 "$MODEL_URL.json" -o "$out/alba.onnx.json"

          (cd "$out" && sha256sum --check <<'SUMS'
          1f9da809b6da1ef4190bb5dd6cce4f4af803274539e9cf9e0693085150bac3d7  alba.onnx
          ed4b1f015a8aae5eb26d4bdeed7b712c660f5698a0dd954aa6df9c8be60b900b  alba.onnx.json
          SUMS
          )

      - name: Synthesize narration and render MP4
        run: |
          out="$RUNNER_TEMP/ucr-curriculum-video"
          python "$PILOT_DIR/narrate.py" "$out/alba.onnx" "$out"
          python "$PILOT_DIR/render.py" "$out"

      - name: Verify the pilot
        run: |
          out="$RUNNER_TEMP/ucr-curriculum-video"
          python "$PILOT_DIR/verify.py" "$out" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: UCR-curriculum-pilot
          path: ${{ runner.temp }}/ucr-curriculum-video/UCR-curriculum-pilot.mp4
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
