name: Dispatch the initial curriculum video pilot test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-curriculum-video-dispatch.yml

permissions:
  actions: write

jobs:
  dispatch:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Dispatch the manual rendering workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/render-curriculum-video.yml/dispatches" -f ref=main
