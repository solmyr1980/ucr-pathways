name: Refresh counselor review indexes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/counselor/comparisons/**'
      - 'data/registry/programmes.csv'
      - 'data/registry/programme_interests.csv'
      - 'scripts/build-counselor-review-index.mjs'
      - 'package.json'
      - '.github/workflows/refresh-counselor-review.yml'

permissions:
  contents: write

concurrency:
  group: counselor-review-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Repair cp-000005 JSON checkpoint
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'data/counselor/comparisons/cp-000005.json';
          const oldText = '\"courseCode\":\"BENENTR212\"}}]},{\"title\":\"Sustainability, technology & data\"';
          const newText = '\"courseCode\":\"BENENTR212\"}}}]},{\"title\":\"Sustainability, technology & data\"';
          const text = fs.readFileSync(file, 'utf8');
          if (text.includes(oldText)) {
            fs.writeFileSync(file, text.replace(oldText, newText));
            console.log('Repaired cp-000005 JSON checkpoint.');
          } else {
            console.log('cp-000005 checkpoint repair already applied.');
          }
          NODE

      - name: Build review indexes
        run: npm run build:counselor-review

      - name: Verify generated review indexes
        run: npm run validate:counselor-review

      - name: Commit refreshed review indexes
        shell: bash
        run: |
          set -euo pipefail
          git add data/counselor/comparisons/cp-000005.json data/counselor/review-programmes.json data/counselor/review-interests.json
          if git diff --cached --quiet; then
            echo "Review indexes already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair cp-000005 and refresh counselor review indexes"
          git push
