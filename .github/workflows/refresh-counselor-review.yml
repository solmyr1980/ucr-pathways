name: Refresh counselor review indexes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/counselor/comparisons/**'
      - 'data/registry/programmes.csv'
      - 'data/registry/programme_interests.csv'
      - 'scripts/build-counselor-review-index.mjs'
      - 'package.json'
      - '.github/workflows/refresh-counselor-review.yml'

permissions:
  contents: write

concurrency:
  group: counselor-review-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Repair cp-000005 JSON checkpoint
        shell: bash
        run: >-
          node -e "const fs=require('fs'); const f='data/counselor/comparisons/cp-000005.json'; let s=fs.readFileSync(f,'utf8'); const fixes=[['\"courseCode\":\"BENENTR212\"}}]},{\"title\":\"Sustainability, technology & data\"','\"courseCode\":\"BENENTR212\"}}}]},{\"title\":\"Sustainability, technology & data\"'],['\"courseCode\":\"DISARIN311\"}}]},{\"title\":\"Personal & professional development\"','\"courseCode\":\"DISARIN311\"}}}]},{\"title\":\"Personal & professional development\"']]; let n=0; for(const [a,b] of fixes){if(s.includes(a)){s=s.replace(a,b); n++;}} fs.writeFileSync(f,s); console.log('Applied '+n+' cp-000005 checkpoint repair(s).');"

      - name: Build review indexes
        run: npm run build:counselor-review

      - name: Verify generated review indexes
        run: npm run validate:counselor-review

      - name: Commit refreshed review indexes
        shell: bash
        run: |
          set -euo pipefail
          git add data/counselor/comparisons/cp-000005.json data/counselor/review-programmes.json data/counselor/review-interests.json
          if git diff --cached --quiet; then
            echo "Review indexes already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair cp-000005 and refresh counselor review indexes"
          git push
