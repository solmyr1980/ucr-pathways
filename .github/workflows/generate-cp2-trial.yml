name: Generate counselor trial cp2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-cp2-trial.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate cp-000002
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import zlib from 'node:zlib';
          const payload = '';
          fs.mkdirSync('data/counselor/comparisons', {recursive: true});
          fs.writeFileSync('data/counselor/comparisons/cp-000002.json', zlib.gunzipSync(Buffer.from(payload, 'base64')));
          NODE

      - name: Validate cp-000002
        run: node scripts/validate-counselor-comparison.mjs cp-000002

      - name: Commit cp-000002
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/counselor/comparisons/cp-000002.json
          git commit -m "Add counselor comparison cp-000002"
          git push
