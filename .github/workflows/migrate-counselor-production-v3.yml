name: One-off counselor production v3 migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-counselor-production-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: counselor-production-v3-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply production migration
        run: node scripts/migrate-counselor-production-v3.mjs

      - name: Validate counselor records
        run: npm run validate:counselor

      - name: Rebuild counselor review indexes
        run: npm run build:counselor-review

      - name: Validate counselor review indexes
        run: npm run validate:counselor-review

      - name: Run repository quality tests
        run: npm test

      - name: Commit migrated production contract and records
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/UCR_Pathways_Master_Specification.md \
            docs/UCR_Pathways_Production_Instructions.md \
            data/schema/counselor-comparison.schema.json \
            data/counselor/comparisons/cp-000001.json \
            data/counselor/comparisons/cp-000002.json \
            data/counselor/comparisons/cp-000003.json \
            data/counselor/comparisons/cp-000004.json \
            data/counselor/review-programmes.json \
            data/counselor/review-interests.json \
            package.json
          if git diff --cached --quiet; then
            echo "Migration produced no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden counselor production structure and provenance"
          git push
