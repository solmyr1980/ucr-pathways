name: Test curriculum narration voice

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Voice cloning engine
        type: choice
        options: [chatterbox-nano, openvoice-v2]
        default: chatterbox-nano
      prompt_start_seconds:
        description: Start of the clean Nano prompt within the prepared reference (seconds)
        type: string
        default: '70.8'

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: curriculum-voice-pilot

jobs:
  make-sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ENGINE: ${{ inputs.engine }}
      PROMPT_START_SECONDS: ${{ inputs.prompt_start_seconds }}
      TQDM_DISABLE: '1'
      VOICE_SCRIPT: pilot/curriculum-video/voice-clone
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: pilot/curriculum-video

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set the scratch directory
        run: echo "VOICE_DIR=$RUNNER_TEMP/ucr-voice" >> "$GITHUB_ENV"

      - name: Fetch the reviewed reference using the repository secret
        env:
          REFERENCE_URL: ${{ secrets.UCR_VOICE_REFERENCE_URL }}
        run: |
          if [[ "$REFERENCE_URL" != https://* ]]; then
            echo "::error::Set the UCR_VOICE_REFERENCE_URL Actions secret to a private HTTPS download for the reviewed reference."
            exit 1
          fi
          umask 077
          mkdir -p "$VOICE_DIR"
          if ! curl --fail --silent --location --proto '=https' --proto-redir '=https' \
              --max-time 120 --retry 2 "$REFERENCE_URL" -o "$VOICE_DIR/reference.audio"; then
            echo "::error::The private reference download failed."
            exit 1
          fi

      - name: Install the CPU synthesizer and verify model downloads
        run: |
          mkdir -p "$VOICE_DIR"
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          case "$ENGINE" in
            chatterbox-nano) installer=install-nano.sh ;;
            openvoice-v2) installer=install.sh ;;
            *) exit 1 ;;
          esac
          /usr/bin/time -v -o "$VOICE_DIR/install-time.txt" \
            bash "$VOICE_SCRIPT/$installer" "$VOICE_DIR/models"

      - name: Synthesize and validate the review clip
        run: |
          out="$VOICE_DIR/review"
          mkdir -p "$out"
          mv "$VOICE_DIR/install-time.txt" "$out/"
          if [[ "$ENGINE" == chatterbox-nano ]]; then
            export PYTHONPATH="$VOICE_DIR/models/chatterbox/src"
            /usr/bin/time -v -o "$out/synthesis-time.txt" \
              python "$VOICE_SCRIPT/synthesize-nano.py" "$VOICE_DIR/reference.audio" \
              "$VOICE_DIR/models/nano" "$out" --prompt-start "$PROMPT_START_SECONDS"
          else
            export PYTHONPATH="$VOICE_DIR/models/openvoice"
            /usr/bin/time -v -o "$out/synthesis-time.txt" \
              python "$VOICE_SCRIPT/synthesize.py" "$VOICE_DIR/reference.audio" \
              "$VOICE_DIR/models/alba.onnx" "$VOICE_DIR/models/converter" "$out"
          fi
          rm -f "$VOICE_DIR/reference.audio"
          ffmpeg -nostdin -xerror -v error -i "$out/UCR-voice-clone-review.wav" -f null -
          ffprobe -v error -show_streams -show_format -of json "$out/UCR-voice-clone-review.wav" > "$out/audio-format.json"
          (cd "$out" && sha256sum UCR-voice-clone-review.wav > SHA256SUMS)
          {
            echo '### Curriculum narration voice review'
            echo
            echo 'CPU runner'
            echo
            lscpu | awk -F: '/^(CPU\(s\)|Model name):/ {print "- " $1 ": " $2}'
            echo
            echo 'Measured clip and synthesis times'
            echo
            echo '```json'
            cat "$out/metrics.json"
            echo '```'
            echo
            awk '/Elapsed \(wall clock\) time|Maximum resident set size/ {sub(/^[ \t]*/, ""); print "- " $0}' "$out/synthesis-time.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: UCR-voice-clone-review
          path: ${{ runner.temp }}/ucr-voice/review/
          if-no-files-found: error
          retention-days: 14
