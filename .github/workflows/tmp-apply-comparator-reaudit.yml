name: One-off comparator row reaudit

on:
  push:
    paths:
      - '.github/workflows/tmp-apply-comparator-reaudit.yml'

permissions:
  contents: write

jobs:
  reaudit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply comparator row re-audit
        run: node scripts/tmp-apply-comparator-reaudit.mjs
      - name: Validate counselor records
        run: npm run validate:counselor
      - name: Rebuild review indexes
        run: npm run build:counselor-review
      - name: Validate review indexes
        run: npm run validate:counselor-review
      - name: Run repository quality tests
        run: npm test
      - name: Commit re-audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/counselor/comparisons/cp-000001.json data/counselor/comparisons/cp-000002.json data/counselor/comparisons/cp-000003.json data/counselor/comparisons/cp-000004.json data/counselor/review-programmes.json data/counselor/review-interests.json
          git diff --cached --quiet && exit 0
          git commit -m "Re-audit comparator row alignment"
          git push origin HEAD:main
