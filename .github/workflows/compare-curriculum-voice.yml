name: Compare curriculum narration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pilot/curriculum-video/experiments/heart-voice/dub.py'
      - '.github/workflows/compare-curriculum-voice.yml'

permissions:
  actions: read
  contents: read

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[compare curriculum voice]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve the approved sixth cut
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45027282662
          name: UCR-curriculum-pilot
          path: baseline
      - name: Install speech and audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rubberband-cli ffmpeg libsndfile1
          python -m pip install --only-binary=:all: kokoro-onnx==0.4.9 onnxruntime==1.32.0 pocketsphinx==5.0.4 soundfile==0.14.0 scipy==1.17.0
      - name: Download and verify Kokoro and its stock voices
        run: |
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -fsSL --retry 3 "$base/kokoro-v1.0.onnx" -o kokoro.onnx
          curl -fsSL --retry 3 "$base/voices-v1.0.bin" -o voices.bin
          sha256sum -c <<'SUMS'
          7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  kokoro.onnx
          bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  voices.bin
          SUMS
      - name: Dub and verify the comparison
        run: |
          python pilot/curriculum-video/experiments/heart-voice/dub.py \
            baseline/UCR-curriculum-pilot.mp4 baseline/UCR-curriculum-pilot.en.srt \
            kokoro.onnx voices.bin comparison
          movie=comparison/UCR-curriculum-cut-6-Heart.mp4
          ffmpeg -v error -xerror -i "$movie" -map 0:v -map 0:a -f null -
          for movie in baseline/UCR-curriculum-pilot.mp4 "$movie"; do
            ffmpeg -v error -i "$movie" -map 0:v:0 -c copy -f hash -hash sha256 -
          done > picture-hashes
          test "$(sort -u picture-hashes | wc -l)" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: UCR-curriculum-cut-6-Heart
          path: comparison/UCR-curriculum-cut-6-Heart.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
