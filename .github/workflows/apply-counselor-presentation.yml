name: Apply counselor summary-first presentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-counselor-presentation.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply presentation changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('pilot/counselor-shiny/app.R')
          app = app_path.read_text()

          marker = '''credit_text <- function(value, fallback = NULL) {
            if (!is.null(value) && nzchar(trimws(as.character(value)))) return(paste0(value, " EC"))
            if (!is.null(fallback)) return(paste0(fallback, " EC"))
            ""
          }
          '''
          insert = marker + '''
          ucr_programmes_for_summary <- function(record) {
            Filter(is_ucr_programme, record$programmes %||% list())
          }

          alternative_rationale_for <- function(record, programme_id) {
            alternatives <- record$academicRationale$alternatives %||% list()
            matches <- Filter(function(item) identical(safe_text(item$programmeId), safe_text(programme_id)), alternatives)
            if (length(matches)) matches[[1]] else NULL
          }

          render_comparison_summary <- function(record) {
            programmes <- ucr_programmes_for_summary(record)
            if (!length(programmes)) return(NULL)
            meta <- comparator_meta(record)
            route <- safe_text(meta$route)
            comparator_name <- safe_text(meta$name)
            comparator_institution <- safe_text(meta$institution)
            comparator_label <- paste(c(comparator_name, if (nzchar(comparator_institution)) paste0("at ", comparator_institution)), collapse = " ")

            cards <- lapply(seq_along(programmes), function(index) {
              programme <- programmes[[index]]
              rationale <- alternative_rationale_for(record, programme$id)
              concept <- if (is.null(rationale)) "" else safe_text(rationale$concept)
              div(
                class = "summary-card",
                div(class = "summary-kicker", if (index == 1) "Closest UCR match" else "Additional UCR option"),
                tags$h3(visible_label(record, programme)),
                if (nzchar(concept)) tags$p(concept)
              )
            })

            div(
              class = "comparison-summary",
              div(
                class = "summary-heading",
                tags$h2("What this comparison shows"),
                tags$p(paste0(
                  "A curriculum-level comparison of ", comparator_label, " with ", length(programmes),
                  if (length(programmes) == 1) " feasible UCR study composition." else " feasible UCR study compositions."
                ))
              ),
              if (nzchar(route)) {
                div(class = "route-note", tags$strong("Comparator pathway shown: "), route)
              },
              div(class = "summary-grid", do.call(tagList, cards)),
              div(
                class = "equivalence-note",
                tags$strong("Important limitation"),
                tags$p("This is a curriculum comparison. A UCR composition is not the same disciplinary degree and does not by itself establish a professional qualification or automatic eligibility for a particular master’s programme.")
              )
            )
          }
          '''
          if marker not in app:
              raise SystemExit('credit_text marker not found')
          app = app.replace(marker, insert, 1)

          old_matches = '''            paste(vapply(matches, function(x) paste0(x$interest, " (", x$relationship, ")"), character(1)), collapse = " · ")
          '''
          new_matches = '''            paste(unique(vapply(matches, function(x) safe_text(x$interest), character(1))), collapse = " · ")
          '''
          if old_matches not in app:
              raise SystemExit('search match rendering marker not found')
          app = app.replace(old_matches, new_matches, 1)

          old_render = '''    render_compare_table(record),
              render_comparison_notes(record),
          '''
          new_render = '''    render_comparison_summary(record),
              render_compare_table(record),
              render_comparison_notes(record),
          '''
          if old_render not in app:
              raise SystemExit('comparison render marker not found')
          app = app.replace(old_render, new_render, 1)

          css_marker = '''      .comparison-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:18px}.comparison-head h1{margin:0 0 8px;font-size:clamp(31px,3vw,43px)}.comparison-head p{color:var(--grey);max-width:850px}.secondary-button{background:transparent!important;color:var(--plum)!important;border:1px solid rgba(73,30,52,.28)!important;border-radius:10px}
          '''
          css_insert = css_marker + '''      .comparison-summary{margin:0 0 20px;background:#fff;border:1px solid rgba(73,30,52,.14);border-radius:14px;padding:18px}.summary-heading h2{margin:0 0 5px;font-size:27px}.summary-heading p{margin:0;color:var(--grey);line-height:1.5}.route-note{margin-top:12px;padding:10px 12px;border-radius:9px;background:rgba(185,217,235,.32);color:var(--plum)}.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}.summary-card{border:1px solid rgba(73,30,52,.14);border-radius:11px;padding:14px;background:rgba(255,255,255,.96)}.summary-card h3{font-family:Inter,Arial,sans-serif;font-size:17px;font-weight:700;margin:3px 0 7px;color:var(--plum)}.summary-card p{margin:0;color:var(--grey);font-size:14px;line-height:1.48}.summary-kicker{text-transform:uppercase;letter-spacing:.055em;font-size:11px;font-weight:800;color:var(--grey)}.equivalence-note{margin-top:14px;border-left:5px solid var(--plum);padding:11px 14px;background:rgba(255,225,164,.28);color:var(--grey);line-height:1.5}.equivalence-note p{margin:4px 0 0}
          '''
          if css_marker not in app:
              raise SystemExit('comparison-head CSS marker not found')
          app = app.replace(css_marker, css_insert, 1)
          app_path.write_text(app)

          test_path = Path('scripts/test-shiny.R')
          test = test_path.read_text()
          test_marker = '''test_record <- jsonlite::fromJSON(counselor$comparison_path(test_comparison_id), simplifyVector = FALSE)
          '''
          test_insert = test_marker + '''
          # Counselor comparison summaries are derived from the four accepted production records.
          acceptance_records <- lapply(sprintf("cp-%06d", 1:4), function(id) {
            record <- jsonlite::fromJSON(file.path("data/counselor/comparisons", paste0(id, ".json")), simplifyVector = FALSE)
            record$origin <- "counselor"
            record
          })
          expected_ucr_counts <- c(2L, 3L, 2L, 3L)
          for (index in seq_along(acceptance_records)) {
            record <- acceptance_records[[index]]
            ucr_programmes <- counselor$ucr_programmes_for_summary(record)
            stopifnot(length(ucr_programmes) == expected_ucr_counts[[index]])
            summary_html <- as.character(counselor$render_comparison_summary(record))
            stopifnot(grepl("What this comparison shows", summary_html, fixed = TRUE))
            stopifnot(grepl("Important limitation", summary_html, fixed = TRUE))
            for (programme in ucr_programmes) {
              stopifnot(grepl(htmltools::htmlEscape(counselor$visible_label(record, programme)), summary_html, fixed = TRUE))
              rationale <- counselor$alternative_rationale_for(record, programme$id)
              if (!is.null(rationale) && nzchar(counselor$safe_text(rationale$concept))) {
                stopifnot(grepl(htmltools::htmlEscape(counselor$safe_text(rationale$concept)), summary_html, fixed = TRUE))
              }
            }
            route <- counselor$safe_text(counselor$comparator_meta(record)$route)
            if (nzchar(route)) stopifnot(grepl(htmltools::htmlEscape(route), summary_html, fixed = TRUE))
          }
          stopifnot(grepl("Brain &amp; Cognition specialisation", as.character(counselor$render_comparison_summary(acceptance_records[[4]])), fixed = TRUE))

          # Relationship classifications remain internal ranking metadata, not counselor-facing search copy.
          result_fixture <- list(list(
            programme = first_programme,
            matches = list(list(interest = "climate change", relationship = "Direct programme interest", score = 100))
          ))
          result_html <- as.character(counselor$render_result_cards(result_fixture))
          stopifnot(grepl("climate change", result_html, fixed = TRUE))
          stopifnot(!grepl("Direct programme interest", result_html, fixed = TRUE))
          '''
          if test_marker not in test:
              raise SystemExit('test insertion marker not found')
          test = test.replace(test_marker, test_insert, 1)
          test_path.write_text(test)
          PY

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependency for Shiny
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev

      - name: Install test dependencies
        run: Rscript -e 'install.packages(c("shiny", "jsonlite", "testthat"), repos=Sys.getenv("RSPM"))'

      - name: Validate presentation changes
        run: |
          Rscript -e 'parse(file="pilot/counselor-shiny/app.R")'
          Rscript scripts/test-shiny.R
          npm run validate:counselor
          npm test

      - name: Commit presentation changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-counselor-presentation.yml
          git add pilot/counselor-shiny/app.R scripts/test-shiny.R
          git diff --cached --check
          git commit -m "Add counselor summary-first comparison view"
          git push origin HEAD:main
