<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UCR Program Builder</title>
  <link rel="stylesheet" href="./assets/css/web.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">UCR Program Builder</div>
      <div id="programmeMeta" class="meta"></div>
    </div>
  </header>

  <main>
    <div class="intro">
      <div>
        <h1 id="pageTitle">Four ways to study the same interests</h1>
        <p class="interests">
          <span id="interestLabel">Your interests:</span>
          <strong id="interestText"></strong>
        </p>
      </div>

      <div class="view-toggle" role="group" aria-label="View mode">
        <button id="compareBtn" class="active" type="button">Compare all</button>
        <button id="singleBtn" type="button">One at a time</button>
      </div>
    </div>

    <div class="spectrum" aria-hidden="true">
      <span id="spectrumLeft">more disciplinary depth</span>
      <div class="spectrum-line"></div>
      <span id="spectrumRight">more interdisciplinary breadth</span>
    </div>

    <section id="compareView" class="compare-shell" aria-label="Programme comparison"></section>

    <section id="singleView" class="single-shell" aria-label="Programme carousel">
      <div class="single-nav">
        <button class="nav-btn" id="prevBtn" type="button" aria-label="Previous programme">‹</button>
        <div class="position">
          <div id="positionTitle" class="position-title"></div>
          <div id="dots" class="dots" aria-label="Programme positions"></div>
        </div>
        <button class="nav-btn" id="nextBtn" type="button" aria-label="Next programme">›</button>
      </div>

      <article id="singleCard" class="single-card"></article>
      <div class="mobile-hint">Swipe left or right to move between programmes</div>
    </section>

    <section id="loadError" class="load-error" hidden></section>
  </main>

  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
